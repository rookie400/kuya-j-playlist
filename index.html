<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jesi Live Radio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:#fff;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   RADIO
========================= */

.radio-screen{
    width:100%;
    height:100%;
    padding:20px;
    background:
        radial-gradient(circle at 50% 0%,#103e2b 0%,#07120d 28%,#050505 65%);
    overflow:hidden;
}

.radio-container{
    width:100%;
    max-width:1100px;
    height:100%;
    margin:auto;
    display:flex;
    flex-direction:column;
}

.topbar{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.station-name{
    font-size:28px;
    font-weight:900;
    color:#00ff88;
    letter-spacing:1px;
}

.live-badge{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border-radius:30px;
    background:#111;
    border:1px solid #333;
    color:#aaa;
    font-size:12px;
    font-weight:bold;
}

.live-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#555;
}

.live-badge.live{
    color:#00ff88;
    border-color:rgba(0,255,136,.4);
}

.live-badge.live .live-dot{
    background:#00ff88;
    box-shadow:0 0 12px #00ff88;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
    }
    50%{
        opacity:.35;
    }
}

.main-grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:18px;
    margin-top:18px;
}

.card{
    background:rgba(10,10,10,.82);
    border:1px solid #222;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 30px rgba(0,0,0,.25);
}

.left-panel,
.right-panel{
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.now-playing{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.now-label{
    color:#888;
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:11px;
    margin-bottom:12px;
}

.song-title{
    max-width:100%;
    font-size:clamp(25px,4vw,48px);
    font-weight:900;
    line-height:1.1;
    color:#fff;
    word-break:break-word;
}

.song-status{
    margin-top:10px;
    color:#00ff88;
    font-size:14px;
}

.equalizer{
    height:100px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:6px;
    margin-top:30px;
}

.bar{
    width:8px;
    height:20px;
    background:#00ff88;
    border-radius:5px 5px 0 0;
    box-shadow:0 0 10px rgba(0,255,136,.5);
    animation:eq 1s ease-in-out infinite;
    animation-play-state:paused;
}

.equalizer.playing .bar{
    animation-play-state:running;
}

.bar:nth-child(1){
    animation-delay:.05s;
}

.bar:nth-child(2){
    animation-delay:.15s;
}

.bar:nth-child(3){
    animation-delay:.25s;
}

.bar:nth-child(4){
    animation-delay:.35s;
}

.bar:nth-child(5){
    animation-delay:.45s;
}

.bar:nth-child(6){
    animation-delay:.55s;
}

.bar:nth-child(7){
    animation-delay:.65s;
}

.bar:nth-child(8){
    animation-delay:.75s;
}

.bar:nth-child(9){
    animation-delay:.85s;
}

.bar:nth-child(10){
    animation-delay:.95s;
}

@keyframes eq{
    0%,100%{
        height:15px;
    }
    50%{
        height:90px;
    }
}

.control-area{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin-top:10px;
}

.play-btn{
    width:76px;
    height:76px;
    border-radius:50%;
    border:2px solid #00ff88;
    background:#07150f;
    color:#00ff88;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:28px;
    box-shadow:0 0 25px rgba(0,255,136,.15);
    transition:.2s;
}

.play-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 30px rgba(0,255,136,.35);
}

.volume-area{
    width:min(300px,70%);
}

.volume-area label{
    display:block;
    color:#777;
    font-size:11px;
    margin-bottom:7px;
}

.volume-area input{
    width:100%;
    accent-color:#00ff88;
}

/* =========================
   INFO CARDS
========================= */

.info-card{
    padding:18px;
}

.info-title{
    color:#888;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:8px;
}

.info-value{
    color:#fff;
    font-size:20px;
    font-weight:bold;
}

.info-value.green{
    color:#00ff88;
}

.clock{
    font-size:28px;
    font-weight:900;
    color:#00ff88;
}

.date{
    margin-top:3px;
    color:#888;
    font-size:12px;
}

.listeners{
    flex:1;
    min-height:100px;
    overflow:hidden;
}

.listener-list{
    margin-top:10px;
    max-height:160px;
    overflow:auto;
}

.listener{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #191919;
    font-size:13px;
}

.listener-name{
    color:#ddd;
}

.listener-time{
    color:#666;
    font-size:11px;
}

.empty-listeners{
    color:#555;
    font-size:13px;
    padding-top:10px;
}

.offline-card{
    display:none;
    text-align:center;
    padding:25px 15px;
}

.offline-card.show{
    display:block;
}

.offline-icon{
    font-size:35px;
    margin-bottom:10px;
}

.offline-title{
    font-size:20px;
    font-weight:900;
    color:#ff5555;
}

.offline-text{
    margin-top:8px;
    color:#888;
    font-size:13px;
    line-height:1.5;
}

.internet-status{
    position:fixed;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    color:#444;
    font-size:10px;
    pointer-events:none;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .radio-screen{
        padding:12px;
    }

    .main-grid{
        grid-template-columns:1fr;
        overflow:auto;
    }

    .left-panel,
    .right-panel{
        min-height:auto;
    }

    .right-panel{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .listeners{
        grid-column:1 / -1;
    }

    .song-title{
        font-size:30px;
    }

    .station-name{
        font-size:21px;
    }
}

@media(max-width:550px){

    .right-panel{
        display:flex;
    }

    .topbar{
        flex-direction:row;
    }

    .clock{
        font-size:23px;
    }
}
</style>

</head>

<script>

/* =====================================================
   SETTINGS
===================================================== */

const START_HOUR = 6;
const END_HOUR = 23;

const PLAYLIST_URL = "playlist.json";

const AUDIO_FOLDER = "mp3/";

const TIME_API_URL =
    "https://timeapi.io/api/Time/current/zone?timeZone=Asia/Manila";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let playlist = [];

let internetTime = null;
let internetTimeReceivedAt = 0;
let internetTimeReady = false;

let currentSongIndex = -1;

let radioStarted = false;
let isPlaying = false;

let listeningStartTime = null;

let lastPositionSync = 0;

let playlistDurationCache = null;

let playRequested = false;


/* =====================================================
   ELEMENTS
===================================================== */

const radioAudio =
    document.getElementById("radioAudio");

const playButton =
    document.getElementById("playButton");

const volumeControl =
    document.getElementById("volumeControl");

const songTitle =
    document.getElementById("songTitle");

const songStatus =
    document.getElementById("songStatus");

const equalizer =
    document.getElementById("equalizer");

const clock =
    document.getElementById("clock");

const date =
    document.getElementById("date");

const liveBadge =
    document.getElementById("liveBadge");

const liveText =
    document.getElementById("liveText");

const offlineCard =
    document.getElementById("offlineCard");

const listeningTime =
    document.getElementById("listeningTime");

const listenerList =
    document.getElementById("listenerList");

const internetStatus =
    document.getElementById("internetStatus");


/* =====================================================
   INTERNET TIME
===================================================== */

function getInternetNow(){

    if(
        !internetTimeReady ||
        !internetTime
    ){

        return null;
    }

    const elapsed =
        Date.now() -
        internetTimeReceivedAt;

    return new Date(
        internetTime.getTime() +
        elapsed
    );
}


async function syncInternetTime(){

    try{

        const requestStart =
            Date.now();

        const response =
            await fetch(
                TIME_API_URL +
                "&_=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Time server error"
            );
        }

        const data =
            await response.json();

        const requestEnd =
            Date.now();

        const serverDate =
            new Date(
                data.dateTime
            );

        if(
            isNaN(
                serverDate.getTime()
            )
        ){

            throw new Error(
                "Invalid server time"
            );
        }

        const networkDelay =
            (
                requestEnd -
                requestStart
            ) / 2;

        internetTime =
            new Date(
                serverDate.getTime() +
                networkDelay
            );

        internetTimeReceivedAt =
            Date.now();

        internetTimeReady =
            true;

        internetStatus.textContent =
            "Internet Time Connected";

        updateClock();

        return true;

    }catch(error){

        internetTimeReady =
            false;

        internetStatus.textContent =
            "Internet Time Unavailable";

        clock.textContent =
            "SYNCING...";

        date.textContent =
            "Waiting for internet time";

        return false;
    }
}


/* =====================================================
   MANILA TIME PARTS
===================================================== */

function getManilaParts(dateObject){

    if(!dateObject){
        return null;
    }

    const formatter =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone:"Asia/Manila",
                year:"numeric",
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",
                hour12:false
            }
        );

    const parts =
        formatter.formatToParts(
            dateObject
        );

    const result = {};

    parts.forEach(part => {

        if(
            part.type !== "literal"
        ){

            result[part.type] =
                Number(part.value);
        }

    });

    if(result.hour === 24){
        result.hour = 0;
    }

    return result;
}


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

    const now =
        getInternetNow();

    if(!now){

        clock.textContent =
            "SYNCING...";

        date.textContent =
            "Internet time required";

        return;
    }

    const timeFormatter =
        new Intl.DateTimeFormat(
            "en-PH",
            {
                timeZone:"Asia/Manila",
                hour:"numeric",
                minute:"2-digit",
                second:"2-digit",
                hour12:true
            }
        );

    const dateFormatter =
        new Intl.DateTimeFormat(
            "en-PH",
            {
                timeZone:"Asia/Manila",
                weekday:"long",
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );

    clock.textContent =
        timeFormatter.format(now);

    date.textContent =
        dateFormatter.format(now);
}


/* =====================================================
   LISTENING HOURS
===================================================== */

function isListeningHours(){

    const now =
        getInternetNow();

    if(!now){
        return false;
    }

    const parts =
        getManilaParts(now);

    if(!parts){
        return false;
    }

    return (
        parts.hour >= START_HOUR &&
        parts.hour < END_HOUR
    );
}


/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist(){

    try{

        const response =
            await fetch(
                PLAYLIST_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Playlist not found"
            );
        }

        const data =
            await response.json();

        if(!Array.isArray(data)){

            throw new Error(
                "Invalid playlist"
            );
        }

        playlist =
            data.map(item => {

                if(
                    typeof item ===
                    "string"
                ){

                    return {
                        title:item,
                        src:
                            AUDIO_FOLDER +
                            item,
                        duration:0
                    };
                }

                return {
                    title:
                        item.title ||
                        item.name ||
                        "Unknown Song",

                    src:
                        item.src ||
                        item.url ||
                        (
                            AUDIO_FOLDER +
                            (
                                item.file ||
                                item.filename ||
                                ""
                            )
                        ),

                    duration:
                        Number(
                            item.duration
                        ) || 0
                };

            });

        playlistDurationCache =
            null;

        songStatus.textContent =
            playlist.length +
            " songs ready";

        return true;

    }catch(error){

        playlist = [];

        songTitle.textContent =
            "Playlist unavailable";

        songStatus.textContent =
            "Unable to load playlist";

        return false;
    }
}


/* =====================================================
   GET SONG DURATION
===================================================== */

async function getSongDuration(song){

    if(
        song.duration &&
        song.duration > 0
    ){

        return song.duration;
    }

    return new Promise(resolve => {

        const temp =
            document.createElement(
                "audio"
            );

        temp.preload =
            "metadata";

        temp.src =
            song.src;

        temp.addEventListener(
            "loadedmetadata",
            () => {

                const duration =
                    Number(
                        temp.duration
                    );

                song.duration =
                    isFinite(duration)
                    ? duration
                    : 0;

                resolve(
                    song.duration
                );

            },
            {
                once:true
            }
        );

        temp.addEventListener(
            "error",
            () => {

                song.duration =
                    0;

                resolve(0);

            },
            {
                once:true
            }
        );

    });
}


/* =====================================================
   TOTAL PLAYLIST DURATION
===================================================== */

async function getTotalPlaylistDuration(){

    if(
        playlistDurationCache &&
        playlistDurationCache > 0
    ){

        return playlistDurationCache;
    }

    if(!playlist.length){
        return 0;
    }

    let total = 0;

    for(
        const song of playlist
    ){

        const duration =
            await getSongDuration(
                song
            );

        if(duration > 0){
            total += duration;
        }
    }

    if(total > 0){

        playlistDurationCache =
            total;
    }

    return total;
}


/* =====================================================
   RADIO POSITION
===================================================== */

async function getRadioPosition(){

    const now =
        getInternetNow();

    if(
        !now ||
        !playlist.length
    ){

        return null;
    }

    const parts =
        getManilaParts(now);

    if(!parts){
        return null;
    }

    const currentSeconds =
        parts.hour * 3600 +
        parts.minute * 60 +
        parts.second +
        (
            now.getMilliseconds() /
            1000
        );

    const startSeconds =
        START_HOUR * 3600;

    let elapsed =
        currentSeconds -
        startSeconds;

    if(elapsed < 0){
        return null;
    }

    const totalDuration =
        await getTotalPlaylistDuration();

    if(
        !totalDuration ||
        totalDuration <= 0
    ){

        return null;
    }

    elapsed =
        elapsed %
        totalDuration;

    let accumulated = 0;

    for(
        let i = 0;
        i < playlist.length;
        i++
    ){

        const duration =
            Number(
                playlist[i].duration
            ) || 0;

        if(
            duration > 0 &&
            elapsed >= accumulated &&
            elapsed <
                accumulated + duration
        ){

            return {
                index:i,
                position:
                    elapsed -
                    accumulated
            };
        }

        accumulated += duration;
    }

    return {
        index:0,
        position:0
    };
}


/* =====================================================
   LOAD SONG
===================================================== */

async function loadSong(
    index,
    position = 0
){

    if(
        index < 0 ||
        index >= playlist.length
    ){

        return false;
    }

    const song =
        playlist[index];

    currentSongIndex =
        index;

    songTitle.textContent =
        song.title;

    songStatus.textContent =
        "Loading...";

    radioAudio.pause();

    radioAudio.src =
        song.src;

    radioAudio.load();

    try{

        await new Promise(
            (resolve,reject) => {

                if(
                    radioAudio.readyState >= 1
                ){

                    resolve();

                    return;
                }

                const onLoaded =
                    () => {

                        cleanup();
                        resolve();
                    };

                const onError =
                    () => {

                        cleanup();
                        reject(
                            new Error(
                                "Audio loading error"
                            )
                        );
                    };

                const cleanup =
                    () => {

                        radioAudio.removeEventListener(
                            "loadedmetadata",
                            onLoaded
                        );

                        radioAudio.removeEventListener(
                            "error",
                            onError
                        );
                    };

                radioAudio.addEventListener(
                    "loadedmetadata",
                    onLoaded
                );

                radioAudio.addEventListener(
                    "error",
                    onError
                );

            }
        );

        if(
            position > 0 &&
            isFinite(
                radioAudio.duration
            )
        ){

            const safePosition =
                Math.min(
                    position,
                    Math.max(
                        0,
                        radioAudio.duration -
                        0.2
                    )
                );

            try{

                radioAudio.currentTime =
                    safePosition;

            }catch(error){}
        }

        songStatus.textContent =
            "READY TO PLAY";

        return true;

    }catch(error){

        songStatus.textContent =
            "Unable to load audio";

        return false;
    }
}


/* =====================================================
   SET ONLINE
===================================================== */

function setOnlineState(){

    liveBadge.classList.add(
        "live"
    );

    liveText.textContent =
        "LIVE";

    offlineCard.classList.remove(
        "show"
    );
}


/* =====================================================
   SET OFFLINE
===================================================== */

function setOfflineState(){

    liveBadge.classList.remove(
        "live"
    );

    liveText.textContent =
        "OFFLINE";

    offlineCard.classList.add(
        "show"
    );

    songTitle.textContent =
        "JESI LIVE RADIO";

    songStatus.textContent =
        "Listening hours: 6:00 AM – 11:00 PM";
}


/* =====================================================
   PLAY BUTTON
===================================================== */

function updatePlayButton(){

    if(isPlaying){

        playButton.textContent =
            "❚❚";

    }else{

        playButton.textContent =
            "▶";
    }
}


async function toggleRadio(){

    /*
       IMPORTANT:
       This function is called directly
       from the user's click on the button.
       This avoids browser autoplay blocking.
    */

    if(!internetTimeReady){

        songStatus.textContent =
            "Synchronizing internet time...";

        const synced =
            await syncInternetTime();

        if(!synced){

            alert(
                "Internet time is not available. Please check your internet connection."
            );

            return;
        }
    }

    if(!isListeningHours()){

        setOfflineState();

        alert(
            "Listening Hours: 6:00 AM – 11:00 PM"
        );

        return;
    }

    setOnlineState();

    /* =========================
       PAUSE
    ========================= */

    if(isPlaying){

        radioAudio.pause();

        isPlaying =
            false;

        equalizer.classList.remove(
            "playing"
        );

        updatePlayButton();

        songStatus.textContent =
            "PAUSED";

        return;
    }


    /* =========================
       LOAD PLAYLIST
    ========================= */

    if(!playlist.length){

        songStatus.textContent =
            "Loading playlist...";

        const loaded =
            await loadPlaylist();

        if(!loaded){

            alert(
                "Unable to load playlist."
            );

            return;
        }
    }


    /* =========================
       FIND CURRENT SONG
    ========================= */

    const position =
        await getRadioPosition();

    if(!position){

        alert(
            "Unable to synchronize the radio position."
        );

        return;
    }


    /* =========================
       LOAD CURRENT SONG
    ========================= */

    if(
        currentSongIndex !==
        position.index
    ){

        const loaded =
            await loadSong(
                position.index,
                position.position
            );

        if(!loaded){
            return;
        }

    }else{

        try{

            if(
                isFinite(
                    radioAudio.duration
                )
            ){

                radioAudio.currentTime =
                    Math.min(
                        position.position,
                        Math.max(
                            0,
                            radioAudio.duration -
                            0.2
                        )
                    );
            }

        }catch(error){}
    }


    /* =========================
       USER CLICKED PLAY
    ========================= */

    try{

        playRequested =
            true;

        await radioAudio.play();

        radioStarted =
            true;

        isPlaying =
            true;

        listeningStartTime =
            listeningStartTime ||
            getInternetNow();

        songStatus.textContent =
            "LIVE STREAM";

        equalizer.classList.add(
            "playing"
        );

        updatePlayButton();

    }catch(error){

        playRequested =
            false;

        isPlaying =
            false;

        radioStarted =
            false;

        equalizer.classList.remove(
            "playing"
        );

        updatePlayButton();

        songStatus.textContent =
            "Press PLAY to start";

        alert(
            "The audio could not start. Please press the PLAY button again."
        );
    }
}


/* =====================================================
   AUDIO PLAY
===================================================== */

radioAudio.addEventListener(
    "play",
    () => {

        isPlaying =
            true;

        radioStarted =
            true;

        if(!listeningStartTime){

            listeningStartTime =
                getInternetNow();
        }

        updatePlayButton();

        equalizer.classList.add(
            "playing"
        );

    }
);


/* =====================================================
   AUDIO PAUSE
===================================================== */

radioAudio.addEventListener(
    "pause",
    () => {

        isPlaying =
            false;

        updatePlayButton();

        equalizer.classList.remove(
            "playing"
        );

    }
);


/* =====================================================
   AUDIO ERROR
===================================================== */

radioAudio.addEventListener(
    "error",
    () => {

        isPlaying =
            false;

        updatePlayButton();

        equalizer.classList.remove(
            "playing"
        );

        songStatus.textContent =
            "Audio file could not be played";
    }
);


/* =====================================================
   AUDIO ENDED
===================================================== */

radioAudio.addEventListener(
    "ended",
    async () => {

        if(
            !isListeningHours()
        ){

            setOfflineState();

            return;
        }

        const position =
            await getRadioPosition();

        if(!position){
            return;
        }

        const loaded =
            await loadSong(
                position.index,
                position.position
            );

        if(
            loaded &&
            radioStarted
        ){

            try{

                await radioAudio.play();

            }catch(error){

                isPlaying =
                    false;

                updatePlayButton();
            }
        }

    }
);


/* =====================================================
   VOLUME
===================================================== */

function changeVolume(value){

    radioAudio.volume =
        Number(value);
}


/* =====================================================
   LISTENING TIME
===================================================== */

function updateListeningTime(){

    if(
        !listeningStartTime ||
        !isPlaying
    ){

        listeningTime.textContent =
            "00:00:00";

        return;
    }

    const now =
        getInternetNow();

    if(!now){
        return;
    }

    const seconds =
        Math.max(
            0,
            Math.floor(
                (
                    now.getTime() -
                    listeningStartTime.getTime()
                ) / 1000
            )
        );

    const h =
        String(
            Math.floor(
                seconds / 3600
            )
        ).padStart(2,"0");

    const m =
        String(
            Math.floor(
                (seconds % 3600) /
                60
            )
        ).padStart(2,"0");

    const s =
        String(
            seconds % 60
        ).padStart(2,"0");

    listeningTime.textContent =
        `${h}:${m}:${s}`;
}


/* =====================================================
   LISTENERS
===================================================== */

function getListeners(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "jesiLiveListeners"
            ) || "[]"
        );

    }catch(error){

        return [];
    }
}


function saveListeners(list){

    try{

        localStorage.setItem(
            "jesiLiveListeners",
            JSON.stringify(list)
        );

    }catch(error){}
}


function addListener(){

    /*
       Login was removed.
       A generic listener entry is used instead.
    */

    const list =
        getListeners();

    const existing =
        list.findIndex(
            item =>
                item.name ===
                "Listener"
        );

    const now =
        getInternetNow();

    const timestamp =
        now
        ? now.toISOString()
        : new Date().toISOString();

    if(existing >= 0){

        list[existing].time =
            timestamp;

    }else{

        list.unshift({
            name:"Listener",
            time:timestamp
        });
    }

    saveListeners(
        list.slice(0,20)
    );

    renderListeners();
}


function renderListeners(){

    const list =
        getListeners();

    if(!list.length){

        listenerList.innerHTML =
            '<div class="empty-listeners">No listeners yet.</div>';

        return;
    }

    listenerList.innerHTML =
        list.map(item => {

            let timeText =
                "";

            try{

                const d =
                    new Date(
                        item.time
                    );

                timeText =
                    new Intl.DateTimeFormat(
                        "en-PH",
                        {
                            timeZone:
                                "Asia/Manila",
                            hour:"numeric",
                            minute:"2-digit",
                            hour12:true
                        }
                    ).format(d);

            }catch(error){

                timeText =
                    "";
            }

            return `
                <div class="listener">
                    <span class="listener-name">
                        ${escapeHtml(item.name)}
                    </span>
                    <span class="listener-time">
                        ${timeText}
                    </span>
                </div>
            `;

        }).join("");
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   INITIALIZATION
===================================================== */

(async function(){

    radioAudio.volume =
        Number(
            volumeControl.value
        );

    renderListeners();

    clock.textContent =
        "SYNCING...";

    date.textContent =
        "Connecting to internet time...";

    await syncInternetTime();

    updateClock();

    if(
        internetTimeReady &&
        isListeningHours()
    ){

        setOnlineState();

        await loadPlaylist();

        if(
            playlist.length
        ){

            const position =
                await getRadioPosition();

            if(position){

                await loadSong(
                    position.index,
                    position.position
                );

                songStatus.textContent =
                    "READY TO PLAY";
            }
        }

    }else if(
        internetTimeReady
    ){

        setOfflineState();

    }

})();


/* =====================================================
   RE-SYNC INTERNET TIME
===================================================== */

setInterval(
    async () => {

        const wasReady =
            internetTimeReady;

        await syncInternetTime();

        if(
            !wasReady &&
            internetTimeReady
        ){

            if(
                isListeningHours()
            ){

                setOnlineState();

                if(
                    !playlist.length
                ){

                    await loadPlaylist();
                }

                const position =
                    await getRadioPosition();

                if(position){

                    await loadSong(
                        position.index,
                        position.position
                    );
                }
            }
        }

        if(
            radioStarted &&
            isPlaying
        ){

            await syncRadioPosition();
        }

    },
    5 * 60 * 1000
);


/* =====================================================
   SYNC PLAYING POSITION
===================================================== */

async function syncRadioPosition(){

    if(
        !internetTimeReady ||
        !isListeningHours() ||
        !isPlaying ||
        !playlist.length
    ){

        return;
    }

    const position =
        await getRadioPosition();

    if(!position){
        return;
    }

    if(
        currentSongIndex !==
        position.index
    ){

        const loaded =
            await loadSong(
                position.index,
                position.position
            );

        if(
            loaded &&
            radioStarted
        ){

            try{

                await radioAudio.play();

            }catch(error){}
        }

        return;
    }

    if(
        isFinite(
            radioAudio.duration
        )
    ){

        const difference =
            Math.abs(
                radioAudio.currentTime -
                position.position
            );

        if(
            difference > 3
        ){

            try{

                radioAudio.currentTime =
                    position.position;

            }catch(error){}
        }
    }
}


/* =====================================================
   MAIN TIMER
===================================================== */

setInterval(
    async () => {

        updateClock();

        updateListeningTime();

        if(
            !internetTimeReady
        ){

            return;
        }

        if(
            !isListeningHours()
        ){

            if(
                isPlaying ||
                radioStarted
            ){

                radioAudio.pause();

                isPlaying =
                    false;

                radioStarted =
                    false;

                updatePlayButton();

                equalizer.classList.remove(
                    "playing"
                );
            }

            setOfflineState();

            return;
        }

        setOnlineState();

        if(
            radioStarted &&
            isPlaying
        ){

            const now =
                Date.now();

            if(
                now -
                lastPositionSync >
                5000
            ){

                lastPositionSync =
                    now;

                await syncRadioPosition();
            }
        }

    },
    1000
);

</script>
